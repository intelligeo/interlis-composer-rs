services:
  - type: web
    name: interlis-composer-rs
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: DEFAULT_MODEL_NAME
        value: ModelName
      - key: DEFAULT_MODEL_LANG
        value: de
      - key: ILI2C_ENABLED
        value: "true"
      - key: ILI2C_BIN
        value: java
      - key: ILI2C_ARGS
        value: -jar /tools/ili2c.jar
